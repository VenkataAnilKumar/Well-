name: Android PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Unit Tests & Architecture Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify no cross-feature Gradle dependencies
        run: |
          if grep -rn 'project(":feature:' feature/*/build.gradle.kts; then
            echo "ERROR: Cross-feature dependencies are prohibited."
            exit 1
          fi

      - name: Compile Debug APK across all modules
        run: gradle :app:assembleDebug --stacktrace

      - name: Run JVM & Robolectric unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
