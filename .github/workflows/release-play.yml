name: Release Android App Bundle

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: true
        default: 'internal'

jobs:
  build-release-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Play upload keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Run full unit test suite
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble signed release App Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload release AAB & R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellplus-release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
